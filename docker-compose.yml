# OcTyn DevOps Services - Docker Compose
# Full stack: mongodb, backend (FastAPI), frontend (React + nginx), agent.
# Copy .env.example to .env and fill in real values before `docker compose up`.
name: central-monitoring

services:
  # --- MongoDB ---
  mongodb:
    image: mongo:7.0
    container_name: central-mongodb
    restart: unless-stopped
    env_file: .env
    ports:
      # Local dev only. Nginx never exposes this port publicly.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./database/init/mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # --- Backend (FastAPI) ---
  backend:
    build: ./backend
    container_name: central-backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_INITDB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_DIR: /logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/logs
    ports:
      # Direct backend access for local debugging only.
      - "127.0.0.1:8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy

  # --- Frontend (React SPA served by nginx, proxies /api to backend) ---
  frontend:
    build: ./frontend
    container_name: central-frontend
    restart: unless-stopped
    ports:
      # 80 on the VPS; 8080 locally to avoid conflicts.
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

  # --- Monitoring agent (one per monitored server) ---
  agent:
    build: ./agent
    container_name: central-agent
    restart: unless-stopped
    env_file: ./agent/.env
    environment:
      API_URL: http://backend:8000/api/v1
    depends_on:
      - backend

  # --- WhatsApp gateway (optional; enable with: --profile whatsapp) ---
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.0
    container_name: central-evolution
    restart: unless-stopped
    profiles: ["whatsapp"]
    depends_on:
      - evolution-postgres
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me-evolution}
      CONFIG_SESSION_PHONE_CLIENT: central-monitoring
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evochange@evolution-postgres:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
    volumes:
      - evolution-instances:/evolution/instances

  evolution-postgres:
    image: postgres:16-alpine
    container_name: central-evolution-db
    restart: unless-stopped
    profiles: ["whatsapp"]
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evochange
      POSTGRES_DB: evolution
    volumes:
      - evolution-pgdata:/var/lib/postgresql/data

volumes:
  mongo-data:
  evolution-instances:
  evolution-pgdata: