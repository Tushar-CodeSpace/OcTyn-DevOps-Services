name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  MONGO_URL: mongodb://root:rootpass@localhost:27017/central_monitoring?authSource=admin

jobs:
  # ---------------------------------------------------------------- tests ---
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - "27017:27017"
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: rootpass
          MONGO_INITDB_DATABASE: central_monitoring
        options: >-
          --health-cmd "mongosh --quiet -u root -p rootpass --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok' | grep -q 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Initialise database (collections, indexes)
        run: uv run python scripts/init_ci_mongo.py

      - name: Seed CI data
        run: uv run python scripts/seed_ci.py

      - name: Auth smoke test
        run: uv run python scripts/test_auth.py

      - name: CRUD smoke test
        run: uv run python scripts/test_crud.py

      - name: Metrics smoke test
        run: uv run python scripts/test_metrics.py

      - name: Settings smoke test
        run: uv run python scripts/test_settings.py

      - name: WhatsApp plumbing test
        run: uv run python scripts/test_whatsapp.py

      - name: Configs smoke test
        run: uv run python scripts/test_configs.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build
        run: npm run build

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check agents
        run: python -m py_compile agent/agent/app.py agent/agent_lite.py

  # --------------------------------------------------------------- images ---
  # Builds and pushes GHCR images. Skipped on PRs.
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, frontend, agent]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: frontend
            context: ./frontend
          - component: agent
            context: ./agent
    steps:
      - uses: actions/checkout@v4

      - name: Bundle static agent script into backend
        run: |
          mkdir -p backend/app/static
          cp agent/agent_lite.py backend/app/static/agent_lite.py
          cp agent/agent_installer.py backend/app/static/agent_installer.py

      - name: Compute image names (GHCR requires lowercase)
        id: meta
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          SHORT_SHA="${GITHUB_SHA::8}"
          echo "prefix=${REGISTRY}/${OWNER_LC}/central-monitoring" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.component }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-${{ matrix.component }}:latest
            ${{ steps.meta.outputs.prefix }}-${{ matrix.component }}:${{ steps.meta.outputs.sha_tag }}

  # --------------------------------------------------------------- deploy ---
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [images]
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      GHCR_USER: ${{ secrets.GHCR_USER }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_PATH,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd "$DEPLOY_PATH"

            git config --global --add safe.directory "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main

            # Pin this deploy to the exact commit's image set (never float on latest)
            NEW_TAG="sha-$(git rev-parse --short=8 HEAD)"
            PREV_TAG="$(cat .last_good_sha 2>/dev/null || true)"

            # Guard: every compose variable WITHOUT a default must exist in .env,
            # otherwise compose silently injects an empty string.
            MISSING=""
            for VAR in $(grep -hoE '\$\{[A-Z_][A-Z0-9_]*\}' docker-compose.yml docker-compose.prod.yml | tr -d '${}' | sort -u); do
              grep -qE "^${VAR}=" .env || MISSING="$MISSING $VAR"
            done
            if [ -n "$MISSING" ]; then
              echo "ERROR: variables missing from .env:$MISSING"
              exit 1
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # The VPS is the monitoring hub — it does not run a monitoring agent.
            # --scale agent=0 starts everything else and removes any agent container.
            deploy() {
              IMAGE_TAG="$1" docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
              IMAGE_TAG="$1" docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans --scale agent=0
            }

            deploy "$NEW_TAG"
            sleep 5

            # Deep healthcheck: backend API + dashboard + every container running.
            if ! curl -fsS http://localhost:8000/health >/dev/null \
               || ! curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              echo "health check failed after deploying $NEW_TAG"
              if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$NEW_TAG" ]; then
                echo "rolling back to $PREV_TAG"
                deploy "$PREV_TAG"
              fi
              exit 1
            fi
            for C in central-backend central-frontend central-mongodb; do
              STATE="$(docker inspect -f '{{.State.Status}}' "$C" 2>/dev/null || true)"
              [ "$STATE" = "running" ] || { echo "container $C is $STATE"; exit 1; }
            done

            echo "$NEW_TAG" > .last_good_sha
            echo "deployed $NEW_TAG successfully"

            # Notify site agents across all remote locations of updated release
            echo "Notifying remote site agents of new release ($NEW_TAG)..."
            curl -s -X POST http://localhost:8000/api/v1/agent/trigger-update \
              -H "Content-Type: application/json" || true
