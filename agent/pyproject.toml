[project]
name = "agent"
version = "0.1.0"
description = "OcTyn DevOps Services continuous monitoring agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "psutil>=6.0.0",
    "pydantic-settings>=2.0.0",
    "pymongo>=4.9",
]

[project.scripts]
agent = "agent.app:main"
cm-agent = "agent.app:main"
